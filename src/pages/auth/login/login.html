<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión - Food Store</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="auth-container">
    <h1>Iniciar Sesión</h1>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" required placeholder="correo@ejemplo.com" />
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn">Ingresar</button>
    </form>
    
    <div id="errorMsg" class="error-msg"></div>
    
    <p class="auth-link">
      ¿No tenés cuenta aún? <a href="/src/pages/auth/registro/registro.html">Registrate acá</a>
    </p>
  </div>

  <!-- Carga absoluta del script de login -->
  <script type="module" src="/src/pages/auth/login/login.ts"></script>
</body>
</html>
