<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - Food Store</title>
  <link rel="stylesheet" href="../../../style.css" />
</head>
<body>
  <div class="auth-container">
    <h1>Crear Cuenta</h1>
    <form id="registroForm">
      <div class="form-group">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" required placeholder="correo@ejemplo.com" />
      </div>
      <div class="form-group">
        <label for="password">Contraseña:</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn">Registrarse</button>
    </form>
    
    <div id="errorMsg" class="error-msg"></div>
    
    <p class="auth-link">
      ¿Ya tenés una cuenta? <a href="../login/login.html">Iniciá sesión acá</a>
    </p>
  </div>

  <!-- Atributo defer agregado para asegurar la carga -->
  <script type="module" src="./registro.ts" defer></script>
</body>
</html>
